services:
  app:
    build: .
    image: finance-planner:latest
    container_name: finance-planner
    restart: unless-stopped
    ports:
      - "8090:3000"
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
